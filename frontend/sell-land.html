<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandVista | List Your Land</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">LandVista<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="properties.html">Explore Lands</a>
      <a href="sell-land.html">Sell Land</a>
    </nav>
    <a class="nav-button" href="sell-land.html">+ List Property</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">SELL WITH LANDVISTA</p>
        <h1>List your land</h1>
        <p class="hero-description">
          Provide accurate details to create your property listing.
        </p>
      </div>
    </section>

    <section class="listings">
      <form id="addLandForm" style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Property Title</label>
          <input type="text" id="title" required placeholder="e.g. Eco Green Plot in Anekal" style="width: 100%; padding: 0.75rem;">
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Location</label>
          <input type="text" id="location" required placeholder="e.g. Anekal" style="width: 100%; padding: 0.75rem;">
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Price (in ₹)</label>
          <input type="number" id="price" required placeholder="3500000" style="width: 100%; padding: 0.75rem;">
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Area (in sq ft)</label>
          <input type="number" id="area" required placeholder="1200" style="width: 100%; padding: 0.75rem;">
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Land Type</label>
          <select id="type" required style="width: 100%; padding: 0.75rem;">
            <option value="Residential">Residential</option>
            <option value="Agricultural">Agricultural</option>
            <option value="Commercial">Commercial</option>
          </select>
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Image URL</label>
          <input type="text" id="image" placeholder="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800" style="width: 100%; padding: 0.75rem;">
        </div>

        <div>
          <label style="display:block; margin-bottom: 0.5rem; font-weight: bold;">Description</label>
          <textarea id="description" rows="4" placeholder="Brief description of the plot..." style="width: 100%; padding: 0.75rem;"></textarea>
        </div>

        <button type="submit" class="nav-button" style="padding: 1rem; border: none; cursor: pointer; font-size: 1rem;">Submit Listing</button>
      </form>
      <p id="formStatus" style="text-align: center; margin-top: 1rem; font-weight: bold;"></p>
    </section>
  </main>

  <script>
    const API_URL = "http://localhost:5000/api/lands";
    const addLandForm = document.getElementById("addLandForm");
    const formStatus = document.getElementById("formStatus");

    addLandForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      formStatus.textContent = "Submitting property...";

      const newLand = {
        title: document.getElementById("title").value.trim(),
        location: document.getElementById("location").value.trim(),
        price: Number(document.getElementById("price").value),
        area: Number(document.getElementById("area").value),
        type: document.getElementById("type").value,
        image: document.getElementById("image").value.trim() || "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800",
        description: document.getElementById("description").value.trim()
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newLand)
        });

        if (!response.ok) throw new Error("Failed to post property");

        formStatus.style.color = "green";
        formStatus.textContent = "Property listed successfully! Redirecting to Home...";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      } catch (err) {
        console.error(err);
        formStatus.style.color = "red";
        formStatus.textContent = "Error submitting property. Check backend server.";
      }
    });
  </script>
</body>
</html>
